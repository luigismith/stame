<text x="6.00" y="99.00" font-size="2.45" fill="#424C47" text-anchor="start" font-weight="400" dominant-baseline="central">DROP (T13, tenuto): Beat, batteria del loop e basso tacciono; al rilascio rientrano sul battito. Accordi, metronomo e colpi dal vivo suonano.</text>
<text x="6.00" y="103.20" font-size="2.45" fill="#424C47" text-anchor="start" font-weight="400" dominant-baseline="central">DRUMS (T11) acceso, modo crea: M densità · m1 stile · m2 variazione; premute: play e stop, la parte di M, idea nuova. Ripremi T11: il loop resta.</text>
<text x="6.00" y="107.40" font-size="2.45" fill="#424C47" text-anchor="start" font-weight="400" dominant-baseline="central">Scene: tocco = richiama, tenuto 1 s = salva. Panic (T12) scatta dopo 1 s, tenuto 3 s = Reset. T14: Geek Out e ritorno. T15: la pagina dei comandi.</text>
